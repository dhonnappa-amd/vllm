group: Hardware - AMD MI355 Load Test
# Load-test steps for verifying the unified amd_mi355 Buildkite queue.
# Each step targets MI355 only (device: mi355_N) and is always required
# (no optional flag, no source_file_dependencies).
# 200 × 1-GPU, 100 × 2-GPU, 70 × 4-GPU, 30 × 8-GPU = 400 jobs total.
# Purpose: confirm all jobs land on queue=amd_mi355 with the correct gpu_size
# tag when ci-infra branch mi355_consolidate is active.
steps:
- label: "(MI355) Load Test 1GPU -1"
  device: mi355_1
  dind: false
  depends_on:
    - image-build-amd
  timeout_in_minutes: 5
  commands:
    - python3 -c "import torch; got=torch.cuda.device_count(); assert got>=1, f\"Need 1 GPUs, got {got}\"; print(f\"MI355 load-test 1GPU: {got} device(s) available\")"

