# Load test for amd_mi355_dpx queue consolidation.
# All jobs land on queue=amd_mi355_dpx with the matching gpu_size tag.
# - 20 × 1-GPU DPX   (device: mi355_dpx)
# - 10 × 2-GPU DPX   (device: mi355_dpx_2)
# - 10 × 4-GPU DPX   (device: mi355_dpx_4)
# None are optional. No source_file_dependencies (always run).
steps:
  - label: "MI355 DPX load-test 1gpu-1"
    key: mi355-dpx-load-1gpu-1
    device: mi355_dpx
    dind: false
    depends_on: [image-build-amd]
    commands: ["pytest tests/basic_correctness/test_basic_correctness.py -x -q"]
